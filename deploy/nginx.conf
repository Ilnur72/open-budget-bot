# Telegram webhook va Mini App uchun nginx konfiguratsiyasi.
# /etc/nginx/sites-available/openbudget-bot ga qo'ying va sites-enabled ga link qiling.

# Rate limit zonalari.
# Webhook faqat Telegram'dan keladi, lekin manzil oshkor bo'lsa uni bombardimon
# qilish mumkin; captcha endpointi esa har foydalanuvchi uchun sekundiga bir necha marta.
# Telegram cheklangan IP puldan yuboradi — bitta IP uchun chegara keng bo'lishi kerak,
# aks holda tig'iz paytda 503 qaytarib, Telegram backoff bilan update'larni kechiktiradi.
limit_req_zone $binary_remote_addr zone=webhook:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=static:10m rate=20r/s;

upstream openbudget_bot {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    # Let's Encrypt tekshiruvi HTTPS'ga yo'naltirilmasin.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS — Mini App HTTPS talab qiladi, downgrade bo'lmasin.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Telefon raqam va OTP shu server orqali o'tadi — access log'da so'rov
    # tanasi bo'lmasa ham, kerak bo'lmagan ma'lumotni yozmaymiz.
    access_log /var/log/nginx/openbudget-bot.access.log;
    error_log  /var/log/nginx/openbudget-bot.error.log warn;

    client_max_body_size 1m;

    # --- Telegram webhook ---
    location = /telegram/webhook {
        limit_req zone=webhook burst=200 nodelay;

        # Telegram update'lari bir necha KB. Secret tekshiruvi tana parse
        # qilingandan KEYIN bo'lgani uchun katta tanani shu yerda kesamiz.
        client_max_body_size 64k;

        # Telegram IP diapazonlari (ixtiyoriy — asosiy himoya secret_token).
        # allow 149.154.160.0/20;
        # allow 91.108.4.0/22;
        # deny all;

        proxy_pass http://openbudget_bot;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ilovaning openbudget.uz uchun umumiy budjeti 45s (TOTAL_BUDGET_MS).
        # Bundan kichik timeout kafolatlangan 504 va Telegram retry degani.
        # Telegram esa ~60s kutadi.
        proxy_read_timeout 55s;
    }

    # --- Captcha Mini App API ---
    location /api/ {
        limit_req zone=api burst=10 nodelay;

        proxy_pass http://openbudget_bot;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # MUHIM: javob foydalanuvchiga xos, URL esa hamma uchun bir xil.
        # Keshlash A ning captchasini B ga berib yuborardi.
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # --- Mini App statik fayllari ---
    location /webapp/ {
        limit_req zone=static burst=40 nodelay;

        proxy_pass http://openbudget_bot;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Health (faqat ichki tarmoqdan) ---
    location /health {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://openbudget_bot;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        access_log off;
    }

    # Boshqa hamma narsa yopiq — ilovada ochiq boshqa yo'l yo'q.
    location / {
        return 404;
    }
}
